<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' file:; connect-src 'none'">
    <title>Desktop Buddy</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="pet-stage" aria-label="Desktop Buddy">
      <img id="yarn-ball" alt="" aria-hidden="true" draggable="false" hidden>
      <div id="pet-art">
        <div id="idle-frames" class="frame-group">
          <img id="pet-image" class="pet-frame" alt="Orange tabby cat">
          <img id="pet-overlay" class="pet-frame" alt="" aria-hidden="true">
        </div>
        <div id="walk-frames" class="frame-group" aria-hidden="true"></div>
        <div id="reaction-frames" class="frame-group" aria-hidden="true"></div>
        <div id="play-frames" class="frame-group" aria-hidden="true"></div>
        <div id="jump-frames" class="frame-group" aria-hidden="true"></div>
      </div>
      <div id="effect-layer" aria-hidden="true"></div>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
