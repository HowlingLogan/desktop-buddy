<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'">
  <title>Desktop Buddy Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Desktop Buddy Settings</h1>
    <p class="intro">Changes are saved locally on this computer.</p>
    <form id="settings-form">
      <label for="pet-size">Pet size</label>
      <select id="pet-size" name="petSize">
        <option value="160">160 px</option><option value="200">200 px</option>
        <option value="240">240 px</option><option value="280">280 px</option>
        <option value="320">320 px</option>
      </select>

      <label for="light-delay">Light activity after</label>
      <select id="light-delay" name="lightDelay">
        <option value="10">10 seconds</option><option value="20">20 seconds</option>
        <option value="30">30 seconds</option>
      </select>

      <label for="walk-delay">Walking after</label>
      <select id="walk-delay" name="walkDelay">
        <option value="60">60 seconds</option><option value="90">90 seconds</option>
        <option value="120">120 seconds</option>
      </select>

      <label for="sleep-delay">Sleep after</label>
      <select id="sleep-delay" name="sleepDelay">
        <option value="150">150 seconds</option><option value="180">180 seconds</option>
        <option value="240">240 seconds</option><option value="300">300 seconds</option>
        <option value="600">600 seconds</option>
      </select>

      <label for="blink-interval">Blink timing</label>
      <select id="blink-interval" name="blinkInterval">
        <option value="">Original timing</option><option value="4">About every 4 seconds</option>
        <option value="6">About every 6 seconds</option><option value="9">About every 9 seconds</option>
        <option value="12">About every 12 seconds</option>
      </select>

      <p id="startup-status" class="hint"></p>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="actions">
        <button type="button" id="reset-defaults">Reset to Defaults</button>
        <button type="button" id="close">Close</button>
        <button type="submit" id="save">Save settings</button>
      </div>
    </form>
  </main>
  <script type="module" src="index.js"></script>
</body>
</html>
